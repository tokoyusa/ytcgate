<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTC GATE</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel untuk kompilasi JSX di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .animate-fadeIn { animation: fadeIn 0.5s ease-in-out; }
    .animate-zoomIn { animation: zoomIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans selection:bg-indigo-100 overflow-x-hidden">
  
  <!-- Container utama React -->
  <div id="root"></div>

  <!-- Source Code Aplikasi React -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- KOMPONEN ICON HELPER UNTUK HTML ---
    const Icon = ({ name, size = 24, className = '' }) => {
      const icon = window.lucide && window.lucide.icons[name];
      if (!icon) return null;
      const svgHtml = icon.toSvg({ width: size, height: size, class: className });
      return <i dangerouslySetInnerHTML={{ __html: svgHtml }} className={`inline-flex items-center justify-center ${className}`} />;
    };

    // --- KONFIGURASI API (GEMINI) ---
    const geminiApiKey = ""; 

    const GeminiAPI = {
      callWithRetry: async (fn, retries = 5) => {
        for (let i = 0; i < retries; i++) {
          try { return await fn(); } catch (err) {
            if (i === retries - 1) throw err;
            await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
          }
        }
      },
      generateText: async (prompt) => {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiApiKey}`;
        const fetchTask = async () => {
          const res = await fetch(url, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) 
          });
          const data = await res.json();
          return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        };
        return await GeminiAPI.callWithRetry(fetchTask);
      },
      analyzeImage: async (prompt, base64Image) => {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiApiKey}`;
        const cleanBase64 = base64Image.replace(/^data:image\/(png|jpeg|jpg|webp);base64,/, '');
        const payload = {
          contents: [{
            role: "user",
            parts: [
              { text: prompt },
              { inlineData: { mimeType: "image/png", data: cleanBase64 } }
            ]
          }]
        };
        const fetchTask = async () => {
          const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const data = await res.json();
          return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        };
        return await GeminiAPI.callWithRetry(fetchTask);
      },
      generateImage: async (promptText) => {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${geminiApiKey}`;
        const enhancedPrompt = `${promptText}, ultra high definition, 8k, sharp focus, cinematic lighting, masterpiece, hyper-realistic details, no text, no labels, no subtitles`;
        const payload = { instances: { prompt: enhancedPrompt }, parameters: { sampleCount: 1 } };
        const fetchTask = async () => {
          const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const data = await res.json();
          const bytes = data.predictions?.[0]?.bytesBase64Encoded || data.predictions?.[0];
          if (typeof bytes === 'string' && bytes.length > 100) return `data:image/png;base64,${bytes}`;
          throw new Error("Gagal mengambil data gambar.");
        };
        return await GeminiAPI.callWithRetry(fetchTask);
      },
      editImage: async (prompt, base64Product, base64ModelRef = null) => {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${geminiApiKey}`;
        const qualityPrompt = `${prompt}. 
          LOCKED VISUAL IDENTITY MANDATE: 
          1. THE PRODUCT IN THE SCENE MUST BE A 100% PIXEL-PERFECT CLONE OF THE PROVIDED PRODUCT IMAGE. 
          2. DO NOT MODIFY THE LOGO, SHAPE, TEXTURE, OR BRANDING ON THE PRODUCT.
          3. THE PERSON IN THE SCENE MUST MATCH THE PROVIDED MODEL IMAGE EXACTLY.
          4. CLEAN IMAGE: NO TEXT, NO SUBTITLES, NO LOGOS, NO CAPTIONS.`;
        
        const parts = [{ text: qualityPrompt }];
        if (base64Product) parts.push({ inlineData: { mimeType: "image/png", data: base64Product.replace(/^data:image\/.*;base64,/, '') } });
        if (base64ModelRef) parts.push({ inlineData: { mimeType: "image/png", data: base64ModelRef.replace(/^data:image\/.*;base64,/, '') } });
        const payload = { contents: [{ parts: parts }], generationConfig: { responseModalities: ["IMAGE", "TEXT"], temperature: 0.05 } };
        const fetchTask = async () => {
          const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const data = await res.json();
          const imgData = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
          return imgData ? `data:image/png;base64,${imgData}` : null;
        };
        return await GeminiAPI.callWithRetry(fetchTask);
      }
    };

    const Supabase = {
      fetch: async (config, endpoint, method = 'GET', body = null) => {
        if (!config.url || !config.key) throw new Error("Konfigurasi Supabase belum diatur.");
        const headers = { 'apikey': config.key, 'Authorization': `Bearer ${config.key}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };
        const response = await fetch(`${config.url}/rest/v1/${endpoint}`, { method, headers, body: body ? JSON.stringify(body) : null });
        if (!response.ok) { const err = await response.json(); throw new Error(err.message || "Gagal menghubungi Supabase."); }
        return await response.json();
      }
    };

    const copyToClipboard = (text) => {
      if (!text) return;
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed"; textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    };

    // Component Preview Modal
    const ImagePreviewModal = ({ url, onClose }) => {
      if (!url) return null;
      return (
        <div className="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4 backdrop-blur-sm" onClick={onClose}>
          <button className="absolute top-6 right-6 text-white hover:text-indigo-400 transition-colors"><Icon name="x" size={32}/></button>
          <img src={url} className="max-w-full max-h-[90vh] rounded-2xl shadow-2xl animate-zoomIn" onClick={e => e.stopPropagation()} />
        </div>
      );
    };

    const StrategyCard = ({ strategy, index, productImages, mainProductId, modelMode, uploadedModel, generatedModel, productBrand, modelDescription, onUpdateImages, onPreview }) => {
      const [isGeneratingScene, setIsGeneratingScene] = useState([false, false, false]);
      const [isGeneratingPrompt, setIsGeneratingPrompt] = useState([false, false, false]);
      const [isRegeneratingText, setIsRegeneratingText] = useState({ type: null, index: null });
      
      const [scripts, setScripts] = useState(() => {
        const s = strategy?.scripts || [];
        return [s[0] || "", s[1] || "", s[2] || ""];
      });
      const [dialogues, setDialogues] = useState(() => {
        const d = strategy?.dialogues || [];
        return [d[0] || "", d[1] || "", d[2] || ""];
      });
      
      const [speakers, setSpeakers] = useState(["Narrator", "Narrator", "Narrator"]);
      const [videoPrompts, setVideoPrompts] = useState(strategy.videoPrompts || ["", "", ""]);

      const fileToBase64 = (file) => new Promise(r => { const rd = new FileReader(); rd.readAsDataURL(file); rd.onload = () => r(rd.result); });

      const handleRegenerateText = async (type, i) => {
        setIsRegeneratingText({ type, index: i });
        if (type === 'script') return;
        const prompt = `Tulis ulang dialog/narasi persuasif untuk Scene ${i+1} (Speaker: ${speakers[i]}) menjadi SATU kalimat singkat dan natural (maksimal 15 kata). Output hanya teks dialog baru dalam Bahasa Indonesia.`;
        try {
          const result = await GeminiAPI.generateText(prompt);
          const newDialogs = [...dialogues];
          newDialogs[i] = result.trim();
          setDialogues(newDialogs);
        } catch (e) { console.error(e); }
        setIsRegeneratingText({ type: null, index: null });
      };

      const handleGeneratePrompt = async (i) => {
        const newGenStatus = [...isGeneratingPrompt];
        newGenStatus[i] = true;
        setIsGeneratingPrompt(newGenStatus);
        const speakerInstruction = speakers[i] === 'Model' 
          ? `Mouth movements MUST sync perfectly with the spoken Indonesian words: "${dialogues[i]}". Visual focus on the mouth.`
          : `Indonesian narrator's voice is clearly heard speaking: "${dialogues[i]}". Subject is silent.`;
        const promptContext = `
          Create a high-end commercial text-to-video prompt (MAX 900 chars).
          VISUAL: ${scripts[i]}
          AUDIO: ${speakers[i]} speaking Indonesian: "${dialogues[i]}".
          ${speakerInstruction}
          CONSISTENCY: Use provided image as starting frame. NO TEXT OVERLAYS.
        `;
        try {
          const result = await GeminiAPI.generateText(promptContext);
          const newPrompts = [...videoPrompts];
          newPrompts[i] = result.substring(0, 900);
          setVideoPrompts(newPrompts);
        } catch (e) { console.error(e); }
        const finalGenStatus = [...isGeneratingPrompt];
        finalGenStatus[i] = false;
        setIsGeneratingPrompt(finalGenStatus);
      };

      const handleGenerateSceneImage = async (i) => {
        const mainProd = productImages.find(p => p.id === mainProductId);
        if (!mainProd) return;
        setIsGeneratingScene(prev => { const n = [...prev]; n[i] = true; return n; });
        const prodB64 = await fileToBase64(mainProd.file);
        let modelB64 = modelMode === 'upload' && uploadedModel ? await fileToBase64(uploadedModel.file) : generatedModel;
        try {
          const visualPromptText = await GeminiAPI.generateText(`
            Create an English visual prompt for: ${scripts[i]}. 
            SCENE MANDATE: The scene MUST feature the brand product "${productBrand}" and the person "${modelDescription}". 
            The product's appearance must be IDENTICAL to the reference image provided.
            CLEAN IMAGE: ABSOLUTELY NO TEXT. photorealistic quality.`);
          const fullVisualPrompt = `${visualPromptText}, ultra high definition, 8k, cinematic, 100% locked product identity, NO text, NO labels.`;
          const imgRes = await GeminiAPI.editImage(fullVisualPrompt, prodB64, modelB64);
          if (imgRes) {
            const currentImages = strategy.images ? [...strategy.images] : [null, null, null];
            currentImages[i] = { url: imgRes, prompt: fullVisualPrompt };
            onUpdateImages(index, currentImages);
          }
        } catch (error) { console.error(error); }
        setIsGeneratingScene(prev => { const n = [...prev]; n[i] = false; return n; });
      };

      return (
        <div className="bg-white rounded-[2rem] md:rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden flex flex-col animate-fadeIn mb-8">
          <div className="bg-slate-900 p-5 md:p-6 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 md:w-10 md:h-10 bg-indigo-500 rounded-lg md:rounded-xl flex items-center justify-center text-white shadow-lg"><Icon name="film" size={18} /></div>
              <div>
                <h3 className="text-white font-bold text-xs md:text-sm uppercase tracking-widest">{strategy?.style || "Ads"} Ads</h3>
                <p className="text-slate-400 text-[8px] md:text-[10px] font-bold">STORYBOARD STRATEGY #{index + 1}</p>
              </div>
            </div>
          </div>
          <div className="p-5 md:p-6 space-y-8">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              {[0, 1, 2].map(i => (
                <div key={i} className="flex flex-col gap-4">
                  <div className="space-y-1.5">
                    <div className="flex items-center justify-between">
                      <p className="text-[9px] text-slate-400 font-bold uppercase">NASKAH ALUR : SCENE {i+1}</p>
                    </div>
                    <textarea value={scripts[i]} onChange={e => { const n = [...scripts]; n[i] = e.target.value; setScripts(n); }} className="w-full text-[11px] p-3 bg-slate-50 border border-slate-200 rounded-xl md:rounded-2xl outline-none min-h-[70px] resize-none focus:bg-white focus:ring-2 focus:ring-indigo-100 transition-all" placeholder="Alur Scene..." />
                  </div>
                  <div className="space-y-1">
                    <div className="flex items-center justify-between mb-1">
                      <div className="flex items-center gap-2">
                        <p className="text-[9px] text-indigo-400 font-bold uppercase">Dialog/Narasi:</p>
                        <button onClick={() => handleRegenerateText('dialogue', i)} disabled={isRegeneratingText.type} className="text-indigo-400 hover:text-indigo-600 transition-colors">
                          <Icon name="refreshCw" size={10} className={isRegeneratingText.type === 'dialogue' && isRegeneratingText.index === i ? 'animate-spin' : ''} />
                        </button>
                      </div>
                      <select className="text-[8px] font-black bg-indigo-50 border border-indigo-100 rounded px-1.5 py-0.5 outline-none text-indigo-600" value={speakers[i]} onChange={e => { const s = [...speakers]; s[i] = e.target.value; setSpeakers(s); }}>
                        <option value="Narrator">NARRATOR</option>
                        <option value="Model">MODEL</option>
                      </select>
                    </div>
                    <textarea value={dialogues[i]} onChange={e => { const d = [...dialogues]; d[i] = e.target.value; setDialogues(d); }} className="w-full text-[11px] p-3 bg-indigo-50/30 border border-indigo-100 rounded-xl md:rounded-2xl outline-none min-h-[50px] resize-none text-indigo-900 font-medium focus:bg-white transition-all" placeholder="Teks dialog..." />
                  </div>
                  <button onClick={() => handleGenerateSceneImage(i)} disabled={isGeneratingScene[i] || !scripts[i]} className="w-full py-2.5 bg-indigo-600 text-white rounded-xl text-[10px] font-black hover:bg-indigo-700 transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-100 disabled:opacity-50">
                    {isGeneratingScene[i] ? <Icon name="loader2" size={14} className="animate-spin" /> : <Icon name="image" size={14} />} BUAT GAMBAR
                  </button>
                  <div className="relative aspect-video bg-slate-50 rounded-2xl md:rounded-3xl border border-slate-100 overflow-hidden group shadow-inner">
                    {strategy.images && strategy.images[i] ? (
                      <>
                        <img src={strategy.images[i].url} className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3">
                           <button onClick={() => onPreview(strategy.images[i].url)} className="p-2.5 bg-white/20 backdrop-blur-md rounded-full text-white hover:bg-white/40"><Icon name="eye" size={18}/></button>
                           <a href={strategy.images[i].url} download className="p-2.5 bg-white/20 backdrop-blur-md rounded-full text-white hover:bg-white/40"><Icon name="download" size={18}/></a>
                        </div>
                      </>
                    ) : (
                      <div className="w-full h-full flex flex-col items-center justify-center text-slate-300 gap-2">
                        {isGeneratingScene[i] ? <Icon name="loader2" className="animate-spin" size={24} /> : <Icon name="image" size={32} className="opacity-20" />}
                      </div>
                    )}
                  </div>
                  <div className="pt-2 border-t border-slate-100">
                    <div className="flex items-center justify-between mb-2">
                       <p className="text-[9px] text-emerald-500 font-bold uppercase tracking-tight">AI Video Prompt:</p>
                       <div className="flex gap-1">
                          <button onClick={() => copyToClipboard(videoPrompts[i])} className="text-[8px] font-bold text-slate-500 hover:text-indigo-600 flex items-center gap-1 bg-white border border-slate-200 px-2 py-1 rounded-lg shadow-sm">
                            <Icon name="copy" size={10} /> SALIN
                          </button>
                          <button onClick={() => handleGeneratePrompt(i)} disabled={isGeneratingPrompt[i] || !(strategy.images && strategy.images[i])} className="text-[9px] font-bold text-indigo-600 hover:bg-indigo-50 px-2 py-1 rounded-lg border border-indigo-100 flex items-center gap-1 uppercase">
                            {isGeneratingPrompt[i] ? <Icon name="loader2" size={10} className="animate-spin" /> : <Icon name="refreshCw" size={10} />} 
                            {videoPrompts[i] ? 'REGENERATE PROMPT' : 'BUAT PROMPT'}
                          </button>
                       </div>
                    </div>
                    <textarea value={videoPrompts[i]} readOnly className="w-full text-[9px] p-3 bg-slate-900 text-slate-300 rounded-xl md:rounded-2xl outline-none min-h-[60px] resize-none font-mono leading-relaxed" />
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const AdminPanel = ({ config, setConfig, onBack }) => {
      const [emails, setEmails] = useState([]);
      const [newEmail, setNewEmail] = useState('');
      const [loading, setLoading] = useState(false);
      useEffect(() => { loadEmails(); }, [config]);
      const loadEmails = async () => { if (!config.url || !config.key) return; try { const data = await Supabase.fetch(config, 'profiles?select=*'); setEmails(data || []); } catch (e) { console.error(e); } };
      const addEmail = async () => { if (!newEmail) return; setLoading(true); try { await Supabase.fetch(config, 'profiles', 'POST', { email: newEmail.toLowerCase().trim() }); setNewEmail(''); loadEmails(); } catch (e) { console.error(e); } setLoading(false); };
      const deleteEmail = async (id) => { try { await Supabase.fetch(config, `profiles?id=eq.${id}`, 'DELETE'); loadEmails(); } catch (e) { console.error(e); } };
      return (
        <div className="min-h-screen bg-slate-50 p-6 flex flex-col items-center">
          <div className="w-full max-w-4xl space-y-6">
            <div className="flex items-center justify-between">
              <h1 className="text-2xl font-bold flex items-center gap-2"><Icon name="settings" className="text-indigo-600" /> Admin Panel</h1>
              <button onClick={onBack} className="text-sm font-bold text-slate-500 hover:text-indigo-600 flex items-center gap-1"><Icon name="x" size={16} /> Tutup</button>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <h2 className="font-bold text-slate-900 flex items-center gap-2"><Icon name="database" size={18} /> Koneksi Supabase</h2>
                <input value={config.url} onChange={e => setConfig({...config, url: e.target.value})} placeholder="URL" className="w-full p-2 border border-slate-200 rounded-lg text-sm" />
                <input value={config.key} onChange={e => setConfig({...config, key: e.target.value})} placeholder="Key" className="w-full p-2 border border-slate-200 rounded-lg text-sm" />
              </div>
              <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <h2 className="font-bold text-slate-900 flex items-center gap-2"><Icon name="user" size={18} /> Kelola Whitelist</h2>
                <div className="flex gap-2">
                  <input value={newEmail} onChange={e => setNewEmail(e.target.value)} placeholder="Email..." className="flex-grow p-2 border border-slate-200 rounded-lg text-sm" />
                  <button onClick={addEmail} disabled={loading} className="p-2 bg-indigo-600 text-white rounded-lg"><Icon name="plus" size={20} /></button>
                </div>
                <div className="max-h-60 overflow-y-auto space-y-2">
                  {emails.map(e => (
                    <div key={e.id} className="flex items-center justify-between p-2 bg-slate-50 rounded-lg border border-slate-100 text-xs">{e.email} <button onClick={() => deleteEmail(e.id)} className="text-red-400"><Icon name="trash2" size={12} /></button></div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const LoginGate = ({ config, onLoginSuccess, onOpenAdmin }) => {
      const [mode, setMode] = useState('user'); 
      const [identifier, setIdentifier] = useState(''); 
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const handleLogin = async (e) => {
        e.preventDefault(); setLoading(true); setError('');
        try {
          if (mode === 'admin') { if (identifier === 'admin' && password === config.adminPass) onOpenAdmin(); else setError('Gagal.'); }
          else { const data = await Supabase.fetch(config, `profiles?email=eq.${identifier.toLowerCase().trim()}&select=*`); if (data?.length > 0) onLoginSuccess(identifier); else setError('Email tidak terdaftar.'); }
        } catch (err) { setError(err.message); } finally { setLoading(false); }
      };
      return (
        <div className="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-50">
          <div className="bg-white w-full max-w-md rounded-3xl p-8 space-y-6">
            <div className="text-center"><div className="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-4"><Icon name="shieldCheck" size={32} /></div><h1 className="text-2xl font-bold">TUTOR YTC</h1></div>
            <div className="flex bg-slate-100 p-1 rounded-xl">
              <button onClick={() => setMode('user')} className={`flex-1 py-2 text-[10px] font-bold rounded-lg ${mode === 'user' ? 'bg-white shadow text-indigo-600' : ''}`}>USER EMAIL</button>
              <button onClick={() => setMode('admin')} className={`flex-1 py-2 text-[10px] font-bold rounded-lg ${mode === 'admin' ? 'bg-white shadow text-indigo-600' : ''}`}>ADMIN</button>
            </div>
            <form onSubmit={handleLogin} className="space-y-4">
              <input type="text" required value={identifier} onChange={e => setIdentifier(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm" placeholder="Masuk dengan email saat Checkout" />
              {mode === 'admin' && <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm" placeholder="Password" />}
              {error && <div className="text-red-500 text-xs text-center font-bold">{error}</div>}
              <button disabled={loading} className="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl">{loading ? '...' : 'Masuk'}</button>
            </form>
          </div>
        </div>
      );
    };

    const App = () => {
      const [view, setView] = useState('gate'); 
      const [activeMenu, setActiveMenu] = useState('tutorial'); // Default diubah ke 'tutorial'
      const [userEmail, setUserEmail] = useState('');
      const [previewImage, setPreviewImage] = useState(null);

                  <div className="space-y-4">
                    <textarea value={transformPrompt} onChange={e => setTransformPrompt(e.target.value)} rows={4} placeholder="Contoh: Modern Villa with pool" className="w-full text-sm p-3 rounded-xl md:rounded-2xl bg-slate-50 border border-slate-100 outline-none shadow-inner resize-none focus:bg-white transition-all" />
                    <button onClick={handleTransformation} disabled={isTransforming || !transformPrompt} className="w-full py-4 bg-indigo-600 text-white rounded-xl md:rounded-2xl font-bold shadow-lg flex items-center justify-center gap-3 hover:bg-indigo-700 transition-all disabled:opacity-50">
                      {isTransforming ? <Icon name="loader2" size={18} className="animate-spin" /> : <Icon name="arrowRightLeft" size={18} />} <span className="uppercase tracking-widest text-[10px] md:text-xs">Proses</span>
                    </button>
                  </div>
                </section>
              </div>
              <div className="lg:col-span-8 xl:col-span-9">
                {transformResults ? (
                  <div className="space-y-8">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 animate-fadeIn">
                      {['before', 'middle', 'after'].map((stage, i) => (
                        <div key={stage} className="space-y-3">
                          <div className="flex items-center justify-between px-2">
                            <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">
                              {stage === 'before' ? 'Original' : stage === 'middle' ? 'Gambar 1: Proses' : 'Gambar 2: Selesai'}
                            </span>
                          </div>
                          <div className="relative group aspect-square bg-white rounded-[1.5rem] md:rounded-[2rem] border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl transition-all">
                            <img src={transformResults[stage]} className="w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3">
                              <button onClick={() => setPreviewImage(transformResults[stage])} className="p-3 bg-white/20 backdrop-blur-md rounded-full text-white hover:bg-white/40"><Icon name="eye" size={20}/></button>
                              <a href={transformResults[stage]} download={`transition_${stage}.png`} className="p-3 bg-white/20 backdrop-blur-md rounded-full text-white hover:bg-white/40"><Icon name="download" size={20}/></a>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                    
                    <div className="bg-slate-900 rounded-[2rem] p-6 md:p-8 shadow-2xl relative overflow-hidden animate-fadeIn">
                      <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-500/10 rounded-full -mr-16 -mt-16 blur-3xl"></div>
                      <div className="flex items-center justify-between mb-6 relative z-10">
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white"><Icon name="clapperboard" size={16} /></div>
                          <span className="text-[10px] font-black text-indigo-400 uppercase tracking-[0.3em]">AI Video Building Prompt</span>
                        </div>
                        <button 
                          onClick={() => copyToClipboard(transformResults.prompt)}
                          className="flex items-center gap-2 text-[10px] font-bold text-slate-400 hover:text-white transition-colors bg-white/5 px-3 py-1.5 rounded-full border border-white/10"
                        >
                          <Icon name="copy" size={12} /> COPY
                        </button>
                      </div>
                      <div className="relative z-10">
                        <div className="w-full text-slate-200 font-mono text-xs md:text-sm leading-relaxed p-5 md:p-6 border border-white/5 rounded-[1.5rem] bg-white/5">
                           {transformResults.prompt}
                           <div className="mt-6 pt-6 border-t border-white/10 flex justify-between items-center">
                              <span className="text-[10px] text-slate-500 font-bold uppercase">{transformResults.prompt.length} Characters</span>
                              <div className="flex gap-1">
                                 <div className="w-1.5 h-1.5 rounded-full bg-indigo-500"></div>
                                 <div className="w-1.5 h-1.5 rounded-full bg-indigo-500/50"></div>
                                 <div className="w-1.5 h-1.5 rounded-full bg-indigo-500/20"></div>
                              </div>
                           </div>
                        </div>
                        <p className="mt-4 text-[9px] text-slate-500 font-bold italic leading-relaxed text-center px-4">
                          "Gunakan prompt di atas pada AI Video Generator untuk menghasilkan video transisi pembangunan yang selaras dengan gambar di atas."
                        </p>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="h-full min-h-[400px] flex flex-col items-center justify-center bg-white rounded-[2rem] md:rounded-[3rem] border border-slate-200 shadow-inner text-slate-300 p-12 text-center">
                     {isTransforming ? (
                       <div className="space-y-4">
                         <Icon name="loader2" size={48} className="animate-spin text-indigo-500 mx-auto" />
                         <p className="text-[10px] font-black uppercase tracking-widest text-indigo-600 animate-pulse">AI Sedang Merancang Bangunan & Prompt Video...</p>
                       </div>
                     ) : (
                       <div className="space-y-4 opacity-30">
                         <Icon name="building" size={64} className="mx-auto" />
                         <p className="text-sm font-bold max-w-xs">Upload foto lahan/bangunan dan masukkan deskripsi untuk melihat transformasi AI.</p>
                       </div>
                     )}
                  </div>
                )}
              </div>
            </main>
          )}

          <footer className="bg-white border-t border-slate-200 mt-auto py-6 md:py-8 px-4 md:px-6">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
              <div className="flex flex-col gap-1 items-center md:items-start">
                <div className="flex items-center gap-2 text-indigo-600 font-bold text-sm">
                  <Icon name="sparkles" size={16} /> YTC GATE V.1.03.01
                </div>
                <p className="text-[10px] text-slate-400 font-medium">© 2026 YTC GATE Enterprise. Semua hak cipta dilindungi.</p>
              </div>
              <div className="flex items-center gap-4 md:gap-8">
                <div className="flex flex-col items-center md:items-end gap-1">
                  <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Sistem Status</span>
                  <div className="flex items-center gap-1.5">
                    <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span className="text-[10px] font-bold text-slate-900">AI Active</span>
                  </div>
                </div>
                <div className="h-8 w-[1px] bg-slate-100"></div>
                <div className="flex flex-col items-center md:items-end gap-1">
                  <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Keamanan</span>
                  <div className="flex items-center gap-1.5">
                    <Icon name="shield" size={12} className="text-indigo-500" />
                    <span className="text-[10px] font-bold text-slate-900">Encrypted</span>
                  </div>
                </div>
              </div>
              <div className="flex gap-4 justify-center">
                <button className="text-[9px] font-bold text-slate-400 hover:text-indigo-600 transition-colors uppercase">Privasi</button>
                <button className="text-[9px] font-bold text-slate-400 hover:text-indigo-600 transition-colors uppercase">Syarat</button>
                <button className="text-[9px] font-bold text-slate-400 hover:text-indigo-600 transition-colors uppercase">Bantuan</button>
              </div>
            </div>
          </footer>
          <ImagePreviewModal url={previewImage} onClose={() => setPreviewImage(null)} />
        </div>
      );
    }

    // Melakukan render aplikasi
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
