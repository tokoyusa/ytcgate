<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdGen Pro - AI Ads Generator</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        fadeIn: 'fadeIn 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
          Upload, Image as ImageIcon, Sparkles, User, 
          Settings, Download, RefreshCw, Clapperboard, 
          Trash2, Wand2, CheckCircle2, PlayCircle, Loader2,
          Monitor, Smartphone, Crop, Scan as ScanFace, Lock, Box, Info,
          Fingerprint, Zap, AlertCircle, LogIn, ShieldCheck, Mail,
          Plus, X, Key, Database, LogOut, ChevronRight
        } from 'https://esm.sh/lucide-react@0.292.0';

        // --- KONFIGURASI API (GEMINI) ---
        const geminiApiKey = ""; // Masukkan API Key Anda di sini

        const GeminiAPI = {
          callWithRetry: async (fn, retries = 5) => {
            for (let i = 0; i < retries; i++) {
              try { return await fn(); } catch (err) {
                if (i === retries - 1) throw err;
                await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
              }
            }
          },
          generateText: async (prompt) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiApiKey}`;
            const fetchTask = async () => {
              const res = await fetch(url, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) 
              });
              const data = await res.json();
              return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            };
            return await GeminiAPI.callWithRetry(fetchTask);
          },
          analyzeImage: async (prompt, base64Image) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiApiKey}`;
            const cleanBase64 = base64Image.replace(/^data:image\/(png|jpeg|jpg|webp);base64,/, '');
            const payload = {
              contents: [{
                role: "user",
                parts: [
                  { text: prompt },
                  { inlineData: { mimeType: "image/png", data: cleanBase64 } }
                ]
              }]
            };
            const fetchTask = async () => {
              const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
              const data = await res.json();
              return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            };
            return await GeminiAPI.callWithRetry(fetchTask);
          },
          generateImage: async (promptText) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${geminiApiKey}`;
            const enhancedPrompt = `${promptText}, ultra high definition, 8k, sharp focus, cinematic lighting, masterpiece, hyper-realistic details`;
            const payload = { instances: { prompt: enhancedPrompt }, parameters: { sampleCount: 1 } };
            const fetchTask = async () => {
              const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
              const data = await res.json();
              const bytes = data.predictions?.[0]?.bytesBase64Encoded || data.predictions?.[0];
              if (typeof bytes === 'string' && bytes.length > 100) return `data:image/png;base64,${bytes}`;
              throw new Error("Gagal mengambil data gambar.");
            };
            return await GeminiAPI.callWithRetry(fetchTask);
          },
          editImage: async (prompt, base64Product, base64ModelRef = null) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${geminiApiKey}`;
            const qualityPrompt = `${prompt}. Output MUST be in ultra high definition, 8k resolution, with extremely sharp details and professional color grading. Ensure no blurriness.`;
            const parts = [{ text: qualityPrompt }];
            if (base64Product) parts.push({ inlineData: { mimeType: "image/png", data: base64Product.replace(/^data:image\/.*;base64,/, '') } });
            if (base64ModelRef) parts.push({ inlineData: { mimeType: "image/png", data: base64ModelRef.replace(/^data:image\/.*;base64,/, '') } });
            const payload = { contents: [{ parts: parts }], generationConfig: { responseModalities: ["IMAGE", "TEXT"], temperature: 0.1 } };
            const fetchTask = async () => {
              const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
              const data = await res.json();
              const imgData = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
              return imgData ? `data:image/png;base64,${imgData}` : null;
            };
            return await GeminiAPI.callWithRetry(fetchTask);
          }
        };

        // --- SUPABASE CLIENT HELPERS ---
        const Supabase = {
          fetch: async (config, endpoint, method = 'GET', body = null) => {
            if (!config.url || !config.key) throw new Error("Konfigurasi Supabase belum diatur.");
            const headers = {
              'apikey': config.key,
              'Authorization': `Bearer ${config.key}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=representation'
            };
            const response = await fetch(`${config.url}/rest/v1/${endpoint}`, { method, headers, body: body ? JSON.stringify(body) : null });
            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.message || "Gagal menghubungi Supabase.");
            }
            return await response.json();
          }
        };

        // --- UTILS ---
        const cropImageToRatio = (base64Image, ratio) => {
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              const [rW, rH] = ratio.split(':').map(Number);
              const ratioVal = rW / rH;
              let w = img.width, h = img.height;
              if (w / h > ratioVal) w = h * ratioVal; else h = w / ratioVal;
              canvas.width = w; 
              canvas.height = h;
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, (img.width - w) / 2, (img.height - h) / 2, w, h, 0, 0, w, h);
              resolve(canvas.toDataURL('image/png', 1.0));
            };
            img.src = base64Image;
          });
        };

        const copyToClipboard = (text) => {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed"; 
          textarea.style.left = "-9999px";
          textarea.style.top = "0";
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          try {
            document.execCommand('copy');
          } catch (err) {
            console.error('Gagal menyalin:', err);
          }
          document.body.removeChild(textarea);
        };

        // --- COMPONENTS ---
        const AdminPanel = ({ config, setConfig, onBack }) => {
          const [emails, setEmails] = useState([]);
          const [newEmail, setNewEmail] = useState('');
          const [newPassword, setNewPassword] = useState('');
          const [status, setStatus] = useState('');
          const [loading, setLoading] = useState(false);

          useEffect(() => { loadEmails(); }, [config]);

          const loadEmails = async () => {
            if (!config.url || !config.key) return;
            try {
              const data = await Supabase.fetch(config, 'profiles?select=*');
              setEmails(data || []);
            } catch (e) { setStatus("Error: " + e.message); }
          };

          const addEmail = async () => {
            if (!newEmail) return;
            setLoading(true);
            try {
              await Supabase.fetch(config, 'profiles', 'POST', { email: newEmail.toLowerCase().trim() });
              setNewEmail('');
              loadEmails();
              setStatus("Email berhasil ditambahkan.");
            } catch (e) { setStatus("Error: " + e.message); }
            setLoading(false);
          };

          const deleteEmail = async (id) => {
            try {
              await Supabase.fetch(config, `profiles?id=eq.${id}`, 'DELETE');
              loadEmails();
              setStatus("Email dihapus.");
            } catch (e) { setStatus("Error: " + e.message); }
          };

          const savePassword = () => {
            if (newPassword.length < 5) { setStatus("Password minimal 5 karakter."); return; }
            setConfig(prev => ({ ...prev, adminPass: newPassword }));
            setStatus("Password admin berhasil dirubah (Hanya untuk sesi ini).");
            setNewPassword('');
          };

          const saveSupabaseConfig = () => {
            localStorage.setItem('supabaseConfig', JSON.stringify({ url: config.url, key: config.key }));
            setStatus("Konfigurasi Supabase berhasil disimpan secara lokal.");
          };

          return (
            <div className="min-h-screen bg-slate-50 p-6 flex flex-col items-center">
              <div className="w-full max-w-4xl space-y-6">
                <div className="flex items-center justify-between">
                  <h1 className="text-2xl font-bold flex items-center gap-2"><Settings className="text-indigo-600" /> Admin Panel</h1>
                  <button onClick={onBack} className="text-sm font-bold text-slate-500 hover:text-indigo-600 flex items-center gap-1"><X size={16} /> Tutup</button>
                </div>
                {status && <div className="p-3 bg-indigo-50 border border-indigo-100 text-indigo-700 text-sm rounded-lg">{status}</div>}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h2 className="font-bold flex items-center gap-2 text-slate-900"><Database size={18} /> Koneksi Supabase</h2>
                    <div className="space-y-3">
                      <input value={config.url} onChange={e => setConfig({...config, url: e.target.value})} placeholder="Supabase Project URL" className="w-full p-2 border border-slate-200 rounded-lg text-sm" />
                      <input value={config.key} onChange={e => setConfig({...config, key: e.target.value})} placeholder="Supabase Anon Key" className="w-full p-2 border border-slate-200 rounded-lg text-sm" />
                      <button onClick={saveSupabaseConfig} className="w-full py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700 transition-colors">Simpan Konfigurasi</button>
                      <p className="text-[10px] text-slate-400 italic">*Konfigurasi disimpan di browser ini agar tidak perlu diisi ulang.</p>
                    </div>
                    <div className="pt-4 border-t border-slate-100 space-y-4">
                      <h2 className="font-bold flex items-center gap-2 text-slate-900"><Key size={18} /> Keamanan Admin</h2>
                      <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder="Password Baru" className="w-full p-2 border border-slate-200 rounded-lg text-sm" />
                      <button onClick={savePassword} className="w-full py-2 bg-slate-800 text-white rounded-lg text-xs font-bold">Ganti Password</button>
                    </div>
                  </div>
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h2 className="font-bold flex items-center gap-2 text-slate-900"><User size={18} /> Kelola Database Users (Profiles)</h2>
                    <div className="flex gap-2">
                      <input value={newEmail} onChange={e => setNewEmail(e.target.value)} placeholder="Tambah Email..." className="flex-grow p-2 border border-slate-200 rounded-lg text-sm" />
                      <button onClick={addEmail} disabled={loading} className="p-2 bg-indigo-600 text-white rounded-lg"><Plus size={20} /></button>
                    </div>
                    <div className="max-h-60 overflow-y-auto space-y-2">
                      {emails.map(e => (
                        <div key={e.id} className="flex items-center justify-between p-2 bg-slate-50 rounded-lg border border-slate-100">
                          <span className="text-xs font-medium">{e.email}</span>
                          <button onClick={() => deleteEmail(e.id)} className="text-red-400 hover:text-red-600"><Trash2 size={14} /></button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const LoginGate = ({ config, onLoginSuccess, onOpenAdmin }) => {
          const [mode, setMode] = useState('user'); 
          const [identifier, setIdentifier] = useState(''); 
          const [password, setPassword] = useState('');
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState('');

          const handleLogin = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError('');
            try {
              if (mode === 'admin') {
                if (identifier === 'admin' && password === config.adminPass) onOpenAdmin();
                else setError('Kredensial admin salah.');
              } else {
                const email = identifier.toLowerCase().trim();
                const data = await Supabase.fetch(config, `profiles?email=eq.${email}&select=*`);
                if (data && data.length > 0) onLoginSuccess(email);
                else setError('Email tidak terdaftar.');
              }
            } catch (err) { setError(err.message); }
            finally { setLoading(false); }
          };

          return (
            <div className="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-50">
              <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8 space-y-6">
                <div className="text-center">
                  <div className="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-4 shadow-xl shadow-indigo-200"><ShieldCheck size={32} /></div>
                  <h1 className="text-2xl font-bold text-slate-900">AdGen Pro Gate</h1>
                  <p className="text-slate-500 text-xs font-bold uppercase tracking-widest mt-1">Enterprise Access Control</p>
                </div>
                <div className="flex bg-slate-100 p-1 rounded-xl">
                  <button onClick={() => setMode('user')} className={`flex-1 py-2 text-[10px] font-bold rounded-lg transition-all ${mode === 'user' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}`}>USER EMAIL</button>
                  <button onClick={() => setMode('admin')} className={`flex-1 py-2 text-[10px] font-bold rounded-lg transition-all ${mode === 'admin' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}`}>ADMIN</button>
                </div>
                <form onSubmit={handleLogin} className="space-y-4">
                  <input type="text" required value={identifier} onChange={e => setIdentifier(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm" placeholder={mode === 'user' ? 'Masukkan email anda saat checkout' : 'Username admin'} />
                  {mode === 'admin' && <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm" placeholder="Password admin" />}
                  {error && <div className="p-3 bg-red-50 text-red-600 text-xs rounded-xl font-bold border border-red-100">{error}</div>}
                  <button disabled={loading} className="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-indigo-700 transition-all">
                    {loading ? <Loader2 className="animate-spin mx-auto" size={20} /> : 'Masuk'}
                  </button>
                </form>
              </div>
            </div>
          );
        };

        const GeneratedCard = ({ item, onRegenerate, isRegenerating }) => {
          const [narration, setNarration] = useState('');
          const [speaker, setSpeaker] = useState('Narrator');
          const [videoPrompt, setVideoPrompt] = useState('');
          const [isGeneratingPrompt, setIsGeneratingPrompt] = useState(false);

          const handleGenerateVideoPrompt = async () => {
            if (!narration) return;
            setIsGeneratingPrompt(true);
            const result = await GeminiAPI.generateText(`Create a concise text-to-video prompt. Dialogue: ${speaker} says: "${narration}". Based on an image where ${item.originalPrompt}. Output only raw prompt.`);
            setVideoPrompt(result);
            setIsGeneratingPrompt(false);
          };

          return (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full animate-fadeIn group relative">
              <div className={`relative w-full bg-slate-100 ${item.aspectRatio === '9:16' ? 'aspect-[9/16]' : 'aspect-[16/9]'}`}>
                <img src={item.url} alt="Result" className={`w-full h-full object-cover transition-opacity ${isRegenerating ? 'opacity-40' : 'opacity-100'}`} />
                {isRegenerating && <div className="absolute inset-0 flex flex-col items-center justify-center bg-white/40 backdrop-blur-sm"><Loader2 className="animate-spin text-indigo-600 mb-2" size={32} /></div>}
                <div className="absolute top-2 right-2 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                  <button onClick={() => onRegenerate(item)} disabled={isRegenerating} className="p-2 bg-black/60 text-white rounded-full"><RefreshCw size={16} /></button>
                  <a href={item.url} download className="p-2 bg-indigo-600 text-white rounded-full"><Download size={16} /></a>
                </div>
                <div className="absolute bottom-2 left-2 px-2 py-0.5 bg-black/50 text-[10px] text-white rounded-md backdrop-blur-sm uppercase font-bold tracking-widest">{item.type === 'product' ? 'Product HD' : 'UGC HD'}</div>
              </div>
              <div className="p-4 flex-grow flex flex-col gap-3">
                <div className="bg-slate-50 p-3 rounded-xl space-y-3">
                  <div className="flex gap-2">
                    <select className="text-[10px] font-bold border border-slate-200 rounded p-1" value={speaker} onChange={e => setSpeaker(e.target.value)}><option value="Narrator">Narrator</option><option value="Model">Model</option></select>
                    <input placeholder="Ketik dialog..." className="flex-grow text-xs p-1 rounded border border-slate-200 outline-none" value={narration} onChange={e => setNarration(e.target.value)} />
                  </div>
                  <button onClick={handleGenerateVideoPrompt} className="w-full py-1.5 bg-indigo-100 text-indigo-700 text-[10px] font-bold rounded-lg hover:bg-indigo-200">
                    {isGeneratingPrompt ? 'MEMPROSES...' : 'BUAT PROMPT VIDEO'}
                  </button>
                  {videoPrompt && (
                    <div className="p-2 bg-slate-900 rounded-lg relative">
                      <p className="text-[9px] text-slate-300 font-mono leading-tight">{videoPrompt}</p>
                      <button onClick={() => copyToClipboard(videoPrompt)} className="text-[9px] text-indigo-400 mt-1 underline font-bold">Salin</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        };

        function App() {
          const [view, setView] = useState('gate'); 
          const [userEmail, setUserEmail] = useState('');
          
          // Mengambil konfigurasi dari localStorage jika ada
          const savedConfig = localStorage.getItem('supabaseConfig');
          const initialConfig = savedConfig ? JSON.parse(savedConfig) : { url: '', key: '' };
          
          const [supabaseConfig, setSupabaseConfig] = useState({ 
            ...initialConfig,
            adminPass: 'adgen123' 
          });

          const [productImages, setProductImages] = useState([]);
          const [mainProductId, setMainProductId] = useState(null);
          const [productBrand, setProductBrand] = useState('');
          const [productDesc, setProductDesc] = useState('');
          const [modelMode, setModelMode] = useState('ai'); 
          const [uploadedModel, setUploadedModel] = useState(null);
          const [modelDescription, setModelDescription] = useState('Seorang wanita muda Asia, kulit cerah, tersenyum ramah, pakaian kasual rapi.'); 
          const [generatedModel, setGeneratedModel] = useState(null);
          const [isGeneratingModel, setIsGeneratingModel] = useState(false);
          const [isAnalyzingModel, setIsAnalyzingModel] = useState(false); 
          const [aspectRatio, setAspectRatio] = useState('9:16');
          const [isGeneratingAds, setIsGeneratingAds] = useState(false);
          const [generatedAds, setGeneratedAds] = useState([]);
          const [progress, setProgress] = useState('');
          const [regeneratingId, setRegeneratingId] = useState(null);

          const fileToBase64 = (file) => new Promise(r => { const rd = new FileReader(); rd.readAsDataURL(file); rd.onload = () => r(rd.result); });

          const handleProductUpload = (e) => {
            const files = Array.from(e.target.files);
            const newImages = files.map(f => ({ id: Math.random().toString(36).substr(2, 9), file: f, url: URL.createObjectURL(f) }));
            setProductImages(prev => {
              const up = [...prev, ...newImages].slice(0, 3);
              if (!mainProductId && up.length > 0) setMainProductId(up[0].id);
              return up;
            });
          };

          const handleModelUpload = async (e) => {
            const file = e.target.files[0];
            if (file) {
              setUploadedModel({ file, url: URL.createObjectURL(file) });
              setIsAnalyzingModel(true);
              const b64 = await fileToBase64(file);
              const desc = await GeminiAPI.analyzeImage(`Analyze face features for reproduction. Start with "A photorealistic photo of a person with..."`, b64);
              setModelDescription(desc || "A professional model.");
              setIsAnalyzingModel(false);
            }
          };

          const generateAiModel = async () => {
            if (!modelDescription) return;
            setIsGeneratingModel(true);
            const res = await GeminiAPI.generateImage(`Medium studio shot of ${modelDescription}, bright professional lighting, plain background, 8k resolution, photorealistic, extremely sharp details`);
            if (res) setGeneratedModel(res);
            setIsGeneratingModel(false);
            return res;
          };

          const generateAds = async () => {
            const mainProd = productImages.find(p => p.id === mainProductId);
            if (!mainProd || !productBrand) return;
            setIsGeneratingAds(true);
            setGeneratedAds([]);
            const prodB64 = await fileToBase64(mainProd.file);
            
            let modelB64 = null;
            if (modelMode === 'upload' && uploadedModel) {
              modelB64 = await fileToBase64(uploadedModel.file);
            } else {
              modelB64 = generatedModel;
              if (!modelB64) {
                setProgress('Menyiapkan Model AI...');
                modelB64 = await generateAiModel();
              }
            }

            setProgress('Menganalisis skenario latar belakang...');
            const contextPrompt = `
              Based on the product: "${productBrand}" and description: "${productDesc}", determine the most relevant and logical environment for this product. 
              Generate 9 unique, highly specific, and creative visual scene descriptions for an advertisement.
              Constraint:
              - 3 scenes for 'Product Only' focus: The background MUST be a realistic and professional setting specific to the product's category.
              - 6 scenes for 'Model + Product' lifestyle: The model MUST be in a realistic environment where the product is typically used.
              - Output ONLY the 9 descriptions separated by the "|" character.
            `;
            const scenariosRaw = await GeminiAPI.generateText(contextPrompt);
            const scenarios = scenariosRaw.split('|').map(s => s.trim()).filter(s => s.length > 0);
            
            const finalScenarios = scenarios.length >= 9 ? scenarios : Array(9).fill(`A creative ad scene for ${productBrand}`);
            const qualitySuffix = "ultra high definition, 8k resolution, cinematic lighting, extremely sharp details, realistic textures, sharp focus";

            const taskPrompts = finalScenarios.map((scenario, i) => ({
              p: i < 3 ? `${scenario}, ${qualitySuffix}` : `${scenario}, [Subject: ${modelDescription}], ${qualitySuffix}`,
              type: i < 3 ? 'product' : 'ugc'
            }));

            setProgress(`Sedang memproses 9 iklan sekaligus (HD)...`);

            try {
              const results = await Promise.all(taskPrompts.map(async (task) => {
                const res = await GeminiAPI.editImage(task.p, prodB64, task.type === 'ugc' ? modelB64 : null);
                if (res) {
                  const crop = await cropImageToRatio(res, aspectRatio);
                  return { id: Math.random(), url: crop, type: task.type, originalPrompt: task.p, aspectRatio };
                }
                return null;
              }));

              const filteredResults = results.filter(r => r !== null);
              setGeneratedAds(filteredResults);
            } catch (error) {
              console.error("Gagal dalam pembuatan iklan paralel:", error);
            }

            setProgress('');
            setIsGeneratingAds(false);
          };

          const handleRegenerate = async (item) => {
            setRegeneratingId(item.id);
            const mainProd = productImages.find(p => p.id === mainProductId);
            const prodB64 = await fileToBase64(mainProd.file);
            let modelB64 = modelMode === 'upload' && uploadedModel ? await fileToBase64(uploadedModel.file) : generatedModel;
            const res = await GeminiAPI.editImage(`STRICTLY IMPROVE QUALITY AND RESOLUTION FOR: ${item.originalPrompt}, ultra sharp, 8k`, prodB64, item.type === 'ugc' ? modelB64 : null);
            if (res) {
              const crop = await cropImageToRatio(res, item.aspectRatio);
              setGeneratedAds(prev => prev.map(ad => ad.id === item.id ? { ...ad, url: crop } : ad));
            }
            setRegeneratingId(null);
          };

          if (view === 'admin') return <AdminPanel config={supabaseConfig} setConfig={setSupabaseConfig} onBack={() => setView('gate')} />;
          if (view === 'gate') return <LoginGate config={supabaseConfig} onLoginSuccess={e => {setUserEmail(e); setView('app');}} onOpenAdmin={() => setView('admin')} />;

          return (
            <div className="min-h-screen bg-slate-50 text-slate-800 font-sans selection:bg-indigo-100">
              <header className="bg-white border-b border-slate-200 sticky top-0 z-10 px-6 h-16 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg"><Sparkles size={18} /></div>
                  <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">AdGen Pro</h1>
                </div>
                <div className="flex items-center gap-4">
                  <div className="text-right hidden sm:block">
                    <p className="text-[10px] font-bold text-slate-900 leading-tight truncate max-w-[150px]">{userEmail}</p>
                    <p className="text-[9px] text-emerald-600 font-bold uppercase tracking-widest flex items-center gap-1 justify-end"><div className="w-1 h-1 bg-emerald-500 rounded-full animate-pulse"></div> Aktif</p>
                  </div>
                  <button onClick={() => setView('gate')} className="p-2 text-slate-300 hover:text-red-500 bg-slate-50 rounded-xl border border-slate-100"><LogOut size={20} /></button>
                </div>
              </header>

              <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-4 xl:col-span-3 space-y-6">
                  <section className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                    <h2 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center justify-between">1. Produk <Box size={14} /></h2>
                    <div className="grid grid-cols-3 gap-2 mb-4">
                      {productImages.map(img => (
                        <div key={img.id} onClick={() => setMainProductId(img.id)} className={`aspect-square rounded-2xl overflow-hidden border-2 cursor-pointer transition-all ${mainProductId === img.id ? 'border-indigo-500 ring-4 ring-indigo-50' : 'border-slate-50'}`}><img src={img.url} className="w-full h-full object-cover" /></div>
                      ))}
                      {productImages.length < 3 && <label className="aspect-square rounded-2xl border-2 border-dashed border-slate-200 flex items-center justify-center cursor-pointer hover:bg-slate-50 group"><Plus size={20} className="text-slate-300 group-hover:text-indigo-500" /><input type="file" onChange={handleProductUpload} className="hidden" multiple /></label>}
                    </div>
                    <input value={productBrand} onChange={e => setProductBrand(e.target.value)} placeholder="Nama Brand/Merek" className="w-full text-sm p-3 rounded-2xl bg-slate-50 border border-slate-100 mb-2 focus:ring-2 focus:ring-indigo-100 outline-none" />
                    <textarea value={productDesc} onChange={e => setProductDesc(e.target.value)} placeholder="Deskripsi Singkat Produk" rows={2} className="w-full text-sm p-3 rounded-2xl bg-slate-50 border border-slate-100 outline-none resize-none focus:ring-2 focus:ring-indigo-100" />
                  </section>

                  <section className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                    <h2 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center justify-between">2. Persona <User size={14} /></h2>
                    <div className="flex bg-slate-50 p-1.5 rounded-2xl mb-4 border border-slate-100">
                      <button onClick={() => setModelMode('ai')} className={`flex-1 py-2 text-[10px] font-bold rounded-xl transition-all ${modelMode === 'ai' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400'}`}>BUAT AI</button>
                      <button onClick={() => setModelMode('upload')} className={`flex-1 py-2 text-[10px] font-bold rounded-xl transition-all ${modelMode === 'upload' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400'}`}>UPLOAD</button>
                    </div>
                    {modelMode === 'ai' ? (
                      <div className="space-y-3">
                        <textarea value={modelDescription} onChange={e => setModelDescription(e.target.value)} className="w-full text-xs p-3 rounded-2xl bg-slate-50 border border-slate-100 h-20 outline-none" />
                        <button onClick={generateAiModel} disabled={isGeneratingModel} className="w-full py-2 bg-slate-800 text-white text-[10px] font-bold rounded-xl flex items-center justify-center gap-2">
                          {isGeneratingModel ? <Loader2 size={14} className="animate-spin" /> : <Wand2 size={14} />} PREVIEW MODEL AI
                        </button>
                        {generatedModel && <img src={generatedModel} className="w-full h-32 object-cover rounded-2xl mt-2 border border-slate-100" />}
                      </div>
                    ) : (
                      <label className="block w-full h-32 rounded-2xl border-2 border-dashed border-slate-200 flex items-center justify-center cursor-pointer overflow-hidden group">
                        {uploadedModel ? <img src={uploadedModel.url} className="w-full h-full object-cover" /> : <Plus size={20} className="text-slate-300" />}
                        <input type="file" onChange={handleModelUpload} className="hidden" />
                      </label>
                    )}
                    {isAnalyzingModel && <p className="text-[9px] text-center text-indigo-600 font-bold mt-2 animate-pulse">MENGANALISIS WAJAH...</p>}
                  </section>

                  <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                    <h2 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">3. Rasio Iklan</h2>
                    <div className="flex gap-2">
                      <button onClick={() => setAspectRatio('9:16')} className={`flex-1 py-2 rounded-2xl border-2 text-[10px] font-black ${aspectRatio === '9:16' ? 'border-indigo-600 bg-indigo-50 text-indigo-600' : 'border-slate-50 text-slate-300'}`}>9:16 STORY</button>
                      <button onClick={() => setAspectRatio('16:9')} className={`flex-1 py-2 rounded-2xl border-2 text-[10px] font-black ${aspectRatio === '16:9' ? 'border-indigo-600 bg-indigo-50 text-indigo-600' : 'border-slate-50 text-slate-300'}`}>16:9 VIDEO</button>
                    </div>
                  </div>

                  <button onClick={generateAds} disabled={isGeneratingAds || productImages.length === 0} className="w-full py-4.5 bg-indigo-600 text-white rounded-[2rem] font-bold shadow-xl shadow-indigo-100 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    {isGeneratingAds ? <Loader2 size={20} className="animate-spin" /> : <Sparkles size={20} />} <span className="uppercase tracking-widest text-xs">Generate 9 Iklan HD</span>
                  </button>
                  {progress && <p className="text-center text-[10px] font-bold text-indigo-600 animate-pulse uppercase tracking-widest">{progress}</p>}
                </div>

                <div className="lg:col-span-8 xl:col-span-9">
                  {generatedAds.length === 0 ? (
                    <div className="h-full min-h-[550px] flex flex-col items-center justify-center bg-white rounded-[3rem] border border-slate-200 shadow-inner text-slate-400 p-12">
                      <div className="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mb-8"><ImageIcon size={40} className="opacity-10" /></div>
                      <h3 className="text-xl font-bold text-slate-900">Siap untuk Berkreasi?</h3>
                      <p className="text-sm max-w-sm text-center mt-3 leading-relaxed font-medium">Masukkan data produk di kiri dan biarkan AI membuatkan 9 aset visual kelas dunia untuk Anda.</p>
                    </div>
                  ) : (
                    <div className="space-y-12">
                      <div>
                        <h3 className="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2"><div className="w-2 h-6 bg-emerald-500 rounded-full"></div> PRODUK FOKUS (3)</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
                          {generatedAds.filter(ad => ad.type === 'product').map(ad => (
                            <GeneratedCard key={ad.id} item={ad} onRegenerate={handleRegenerate} isRegenerating={regeneratingId === ad.id} />
                          ))}
                        </div>
                      </div>
                      <div>
                        <h3 className="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2"><div className="w-2 h-6 bg-purple-500 rounded-full"></div> GAYA HIDUP & UGC (6)</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
                          {generatedAds.filter(ad => ad.type === 'ugc').map(ad => (
                            <GeneratedCard key={ad.id} item={ad} onRegenerate={handleRegenerate} isRegenerating={regeneratingId === ad.id} />
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </main>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
